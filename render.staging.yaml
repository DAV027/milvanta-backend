# Render Blueprint for Milvanta Staging Environment
# Fully isolated from production: dedicated PostgreSQL DB, API web service, and delivery scheduler.
databases:
  - name: milvanta-db-staging
    databaseName: milvanta_staging
    user: milvanta_staging_user
    plan: starter
    region: oregon

services:
  - type: web
    name: milvanta-api-staging
    runtime: node
    plan: starter
    region: oregon
    branch: feature/whatsapp-only-final
    buildCommand: npm ci
    preDeployCommand: node src/migrate.js --staging
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: milvanta-db-staging
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://milvanta-staging.pages.dev,https://*.pages.dev,https://solitary-firefly-ef06.akhilrajuvarma.workers.dev
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Milvanta Staging <orders@milvanta.in>"
      - key: ADMIN_EMAIL
        value: "projects@milvanta.in"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v25.0
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_APPROVED_TEMPLATES
        value: ""
      - key: DELIVERY_REMINDER_TIME_IST
        value: "21:00"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_OTP_HASH_SECRET
        sync: false

  - type: cron
    name: milvanta-delivery-staging
    runtime: node
    plan: starter
    region: oregon
    branch: feature/whatsapp-only-final
    schedule: "45 14 * * *" # Runs daily at 20:15 IST (14:45 UTC)
    buildCommand: npm ci
    startCommand: node scripts/daily-delivery-scheduler.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DELIVERY_SCHEDULER_ENABLED
        value: "false" # Disabled until acceptance tests pass
      - key: DATABASE_URL
        fromDatabase:
          name: milvanta-db-staging
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v25.0
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_APPROVED_TEMPLATES
        value: ""
      - key: DELIVERY_REMINDER_TIME_IST
        value: "21:00"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_OTP_HASH_SECRET
        sync: false

