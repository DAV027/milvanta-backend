databases:
  - name: milvanta-db
    plan: basic-256mb
    databaseName: milvanta
    user: milvanta

services:
  - type: web
    name: milvanta-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: milvanta-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://solitary-firefly-ef06.akhilrajuvarma.workers.dev,https://milvanta.in,https://www.milvanta.in
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
