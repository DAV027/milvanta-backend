services:
  - type: web
    name: milvanta-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://solitary-firefly-ef06.akhilrajuvarma.workers.dev,https://milvanta.in,https://www.milvanta.in
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SERVICEABLE_PIN_CODES
        sync: false
      - key: DELIVERY_CHARGE_PAISE
        sync: false
      - key: ADMIN_API_KEY
        sync: false
