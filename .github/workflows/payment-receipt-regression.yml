name: Payment and receipt regression checks

on:
  pull_request:
    paths:
      - 'src/email.js'
      - 'src/server.js'
      - 'src/razorpaySubscriptionErrors.js'
      - 'tests/razorpay-subscription-400-diagnostics.test.js'
      - 'tests/order-email-subscription-gateway-regression.test.js'
      - 'tests/razorpay-readonly-diagnostic.test.js'
      - 'scripts/razorpay-readonly-diagnostic.mjs'
      - 'scripts/razorpay-existing-test-plan-diagnostic.mjs'
      - 'scripts/razorpay-subscription-test-probe.mjs'
      - 'tests/razorpay-subscription-test-probe.test.js'
      - 'tests/razorpay-existing-test-plan-diagnostic.test.js'
      - 'tests/checkout-auth-payment-comprehensive.test.js'
      - 'tests/helpers/testDbGuard.js'
      - 'migrations/**'
      - '.github/workflows/payment-receipt-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/email.js
          node --check src/server.js
          node --check tests/order-email-subscription-gateway-regression.test.js
          node --check scripts/razorpay-readonly-diagnostic.mjs
          node --check tests/razorpay-readonly-diagnostic.test.js
          node --check src/razorpaySubscriptionErrors.js
          node --check tests/razorpay-subscription-400-diagnostics.test.js
          node --check scripts/razorpay-existing-test-plan-diagnostic.mjs
          node --check tests/razorpay-existing-test-plan-diagnostic.test.js
          node --check scripts/razorpay-subscription-test-probe.mjs
          node --check tests/razorpay-subscription-test-probe.test.js
      - name: Test email outbox, Razorpay error handling and safe diagnostics (no credentials or database)
        run: node --test tests/order-email-subscription-gateway-regression.test.js tests/razorpay-readonly-diagnostic.test.js tests/razorpay-subscription-400-diagnostics.test.js tests/razorpay-existing-test-plan-diagnostic.test.js tests/razorpay-subscription-test-probe.test.js

  isolated-postgres-payment-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
      # Intentionally no production DATABASE_URL, payment keys, or email secrets.
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install lockfile dependencies
        run: npm ci
      - name: Verify database isolation before integration tests
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js'; assertTestDatabaseConfigured(); if (testDbConfig.dbName !== 'milvanta_test' || !['localhost','127.0.0.1'].includes(testDbConfig.hostname)) process.exit(1); console.log('Disposable local PostgreSQL database confirmed')"
      - name: Run captured-payment to email-outbox regression with disposable schema
        run: node --test tests/checkout-auth-payment-comprehensive.test.js

  full-isolated-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run full test suite against disposable PostgreSQL
        run: npm test
