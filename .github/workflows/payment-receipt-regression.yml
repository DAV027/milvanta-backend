name: Payment and receipt regression checks

on:
  pull_request:
    paths:
      - 'src/email.js'
      - 'src/emailTemplateRenderers.js'
      - 'tests/branded-email-templates.test.js'
      - 'tests/email-receipt-amount-validation.test.js'
      - 'scripts/preview-email-templates.mjs'
      - 'src/server.js'
      - 'frontend/index.html'
      - 'frontend/cloudflare-upload/index.html'
      - 'frontend/js/script.js'
      - 'frontend/cloudflare-upload/js/script.js'
      - 'frontend/js/profile.js'
      - 'frontend/cloudflare-upload/js/profile.js'
      - 'tests/milk-launch-order-refund-status.test.js'
      - 'frontend/admin.html'
      - 'frontend/cloudflare-upload/admin.html'
      - 'tests/admin-login-dashboard-client.test.js'
      - 'tests/admin-login-role-projection.test.js'
      - 'src/services/deliveryEngine.js'
      - 'src/services/deliveryCronPolicy.js'
      - 'tests/delivery-cron-policy.test.js'
      - 'docs/DAILY_DELIVERY_CRON_RUNBOOK.md'
      - 'workers/milvanta-delivery-cron/**'
      - 'tests/delivery-cron-cloudflare-worker.test.js'
      - 'src/razorpaySubscriptionErrors.js'
      - 'tests/razorpay-subscription-400-diagnostics.test.js'
      - 'tests/order-email-subscription-gateway-regression.test.js'
      - 'tests/razorpay-readonly-diagnostic.test.js'
      - 'scripts/razorpay-readonly-diagnostic.mjs'
      - 'scripts/razorpay-existing-test-plan-diagnostic.mjs'
      - 'scripts/razorpay-subscription-test-probe.mjs'
      - 'tests/razorpay-subscription-test-probe.test.js'
      - 'tests/razorpay-webhook-contract-audit.test.js'
      - 'docs/SUBSCRIPTION_E2E_AUDIT_CORRECTIONS_2026-11-04.md'
      - 'tests/razorpay-existing-test-plan-diagnostic.test.js'
      - 'tests/checkout-auth-payment-comprehensive.test.js'
      - 'src/services/milkCapacityService.js'
      - 'src/services/subscriptionService.js'
      - 'tests/milk-startup-operations.test.js'
      - 'tests/helpers/testDbGuard.js'
      - 'migrations/**'
      - '.github/workflows/payment-receipt-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/email.js
          node --check src/emailTemplateRenderers.js
          node --check scripts/preview-email-templates.mjs
          node --check tests/branded-email-templates.test.js
          node --check tests/email-receipt-amount-validation.test.js
          node --check src/server.js
          node --check frontend/js/script.js
          node --check frontend/js/profile.js
          node --check tests/milk-launch-order-refund-status.test.js
          node --check tests/admin-login-dashboard-client.test.js
          node --check tests/admin-login-role-projection.test.js
          node --check src/services/deliveryEngine.js
          node --check src/services/deliveryCronPolicy.js
          node --check tests/delivery-cron-policy.test.js
          node --check tests/order-email-subscription-gateway-regression.test.js
          node --check scripts/razorpay-readonly-diagnostic.mjs
          node --check tests/razorpay-readonly-diagnostic.test.js
          node --check src/razorpaySubscriptionErrors.js
          node --check tests/razorpay-subscription-400-diagnostics.test.js
          node --check scripts/razorpay-existing-test-plan-diagnostic.mjs
          node --check tests/razorpay-existing-test-plan-diagnostic.test.js
          node --check scripts/razorpay-subscription-test-probe.mjs
          node --check tests/razorpay-subscription-test-probe.test.js
          node --check tests/delivery-cron-policy.test.js
          node --check workers/milvanta-delivery-cron/index.mjs
          node --check tests/delivery-cron-cloudflare-worker.test.js
          node --check tests/razorpay-webhook-contract-audit.test.js
          node --check src/services/milkCapacityService.js
          node --check src/services/subscriptionService.js
          node --check tests/milk-startup-operations.test.js
      - name: Test email outbox, Razorpay error handling and safe diagnostics (no credentials or database)
        run: node --test tests/branded-email-templates.test.js tests/order-email-subscription-gateway-regression.test.js tests/razorpay-readonly-diagnostic.test.js tests/razorpay-subscription-400-diagnostics.test.js tests/razorpay-existing-test-plan-diagnostic.test.js tests/razorpay-subscription-test-probe.test.js tests/razorpay-webhook-contract-audit.test.js tests/delivery-cron-policy.test.js tests/delivery-cron-cloudflare-worker.test.js tests/admin-login-dashboard-client.test.js

  isolated-postgres-payment-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
      # Intentionally no production DATABASE_URL, payment keys, or email secrets.
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install lockfile dependencies
        run: npm ci
      - name: Verify database isolation before integration tests
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js'; assertTestDatabaseConfigured(); if (testDbConfig.dbName !== 'milvanta_test' || !['localhost','127.0.0.1'].includes(testDbConfig.hostname)) process.exit(1); console.log('Disposable local PostgreSQL database confirmed')"
      - name: Run captured-payment to email-outbox regression with disposable schema
        run: node --test tests/checkout-auth-payment-comprehensive.test.js

  full-isolated-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run full test suite against disposable PostgreSQL
        run: npm test

  # Completely synthetic previews for design review. No npm packages,
  # email provider keys, database, external fetches, or production access.
  email-preview-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate synthetic email preview gallery
        run: node scripts/preview-email-templates.mjs
      - name: Verify preview file count and absence of live credentials
        run: |
          test "$(find email-previews -maxdepth 1 -name '*.html' -type f | wc -l)" -eq 7
          ! grep -REl 'rzp_(live|test)_[A-Za-z0-9]{8,}|whsec_[A-Za-z0-9]{16,}|@gmail\.com|@yahoo\.com' email-previews/
          ! grep -REl '<script\b|javascript:' email-previews/
          grep -q 'Pending delivery scheduling' email-previews/customer-subscription.html
          ! grep -q 'Tomorrow, 6:00 AM' email-previews/customer-subscription.html
      - name: Upload HTML previews for manual email-client review (NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: milvanta-synthetic-email-previews
          path: email-previews/
          if-no-files-found: error
          retention-days: 7


  # Focused end-to-end email tests; the full backend suite can exceed its
  # independent 18-minute timeout. Safe isolated DB and mocked providers.
  email-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
      WHATSAPP_ENABLED: 'false'
      # No live API keys, SMTP credentials, or production DB URL.
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Guard test environment before loading application
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js'; assertTestDatabaseConfigured(); if (testDbConfig.dbName !== 'milvanta_test' || !['localhost','127.0.0.1'].includes(testDbConfig.hostname)) process.exit(1); console.log('Disposable PostgreSQL confirmed')"
      - name: Run email OTP, outbox, payment blockers and provider-fallback tests
        run: |
          node --test --test-concurrency=1 \
            tests/branded-email-templates.test.js \
            tests/email-receipt-amount-validation.test.js \
            tests/email-outbox-payment-blockers.test.js \
            tests/complete-e2e-email-otp-payments.test.js

  # Focused admin sign-in and role handling, with disposable PostgreSQL only.
  admin-login-database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
    steps:
      - name: Checkout review source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Guard disposable local-only database
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js'; assertTestDatabaseConfigured(); if(process.env.NODE_ENV !== 'test'||testDbConfig.dbName !== 'milvanta_test'||!['127.0.0.1','localhost'].includes(testDbConfig.hostname))process.exit(1)"
      - name: Test administrator role, login, session revocation and client race protection
        run: |
          node --test --test-concurrency=1 \
            tests/admin-login-role-projection.test.js \
            tests/admin-login-dashboard-client.test.js

  # Core admin module coverage: deliveries, orders, subscriptions, customers,
  # refunds, inventory, demand forecast, CSV exports and authorization.
  # Existing V2 demand-forecast test failed with an uncaught ReferenceError in
  # production but was not included in the previous focused CI jobs.
  admin-portal-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
      WHATSAPP_ENABLED: 'false'
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm disposable PostgreSQL before testing
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js'; assertTestDatabaseConfigured(); if(process.env.NODE_ENV !== 'test' || testDbConfig.dbName !== 'milvanta_test' || !['localhost','127.0.0.1'].includes(testDbConfig.hostname))process.exit(1)"
      - name: Test admin modules and demand forecast/export (positive data)
        run: |
          node --test --test-concurrency=1 \
            tests/admin-operations-portal-v2.test.js \
            tests/admin-v3-inventory-delivery.test.js \
            tests/admin-dashboard-and-smoke.test.js

  # Targeted validation of historic demand parser and vacation-resume behavior.
  # These suites were failing in the monolithic test runner after stock
  # confirmation became mandatory. Use a disposable owner-confirmed fixture.
  admin-calendar-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
      WHATSAPP_ENABLED: 'false'
    steps:
      - name: Checkout review code
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify isolated test database
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js';assertTestDatabaseConfigured();if(process.env.NODE_ENV !== 'test'||testDbConfig.dbName !== 'milvanta_test'||!['localhost','127.0.0.1'].includes(testDbConfig.hostname))process.exit(1)"
      - name: Validate demand parser, vacation resume and calendar behavior
        run: |
          node --test --test-concurrency=1 \
            tests/admin-operations-hardening.test.js \
            tests/calendar-delivery-postgresql-integration.test.js \
            tests/calendar-tab-profile.test.js

  # Startup milk-only storefront and customer refund status, test database only.
  milk-launch-refund-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: milvanta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milvanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/milvanta_test
      DATABASE_SSL: 'false'
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm isolated disposable database
        run: |
          node --input-type=module -e "import {testDbConfig,assertTestDatabaseConfigured} from './tests/helpers/testDbGuard.js';assertTestDatabaseConfigured();if(process.env.NODE_ENV!=='test'||testDbConfig.dbName!=='milvanta_test'||!['127.0.0.1','localhost'].includes(testDbConfig.hostname))process.exit(1)"
      - name: Test customer refunds, milk category launch, and admin parity
        run: node --test --test-concurrency=1 tests/milk-launch-order-refund-status.test.js tests/milk-startup-operations.test.js
